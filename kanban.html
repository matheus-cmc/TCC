<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlowUp • Kanban de Produção</title>
  <link rel="stylesheet" href="kanban.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="dot"></span> FlowUp</div>

    <div class="filters">
      <label>
        Responsável
        <select id="f-resp">
          <option value="">Todos</option>
        </select>
      </label>
      <label>
        Prioridade
        <select id="f-pri">
          <option value="">Todas</option>
          <option>Alta</option>
          <option>Média</option>
          <option>Baixa</option>
        </select>
      </label>
      <label>
        Tipo
        <select id="f-tipo">
          <option value="">Todos</option>
          <option>Reels</option>
          <option>Vídeo</option>
          <option>Carrossel</option>
          <option>Foto</option>
          <option>Stories</option>
        </select>
      </label>
      <button id="clearFilters" class="btn ghost">Limpar</button>
    </div>

    <button id="btnNovo" class="btn grad">+ Novo Card</button>
  </header>

  <main class="board" id="board" aria-label="Quadro Kanban">
    <!-- As colunas são geradas por HTML direto para manter acessibilidade -->
    <section class="col" data-status="Redação">
      <h3>Redação</h3>
      <div class="lane" aria-label="Redação"></div>
    </section>

    <section class="col" data-status="Gravação">
      <h3>Gravação</h3>
      <div class="lane" aria-label="Gravação"></div>
    </section>

    <section class="col" data-status="Edição de vídeo">
      <h3>Edição de vídeo</h3>
      <div class="lane" aria-label="Edição de vídeo"></div>
    </section>

    <section class="col" data-status="Design">
      <h3>Design</h3>
      <div class="lane" aria-label="Design"></div>
    </section>

    <section class="col" data-status="Revisão">
      <h3>Revisão</h3>
      <div class="lane" aria-label="Revisão"></div>
    </section>

    <section class="col" data-status="Fotografia">
      <h3>Fotografia</h3>
      <div class="lane" aria-label="Fotografia"></div>
    </section>

    <section class="col" data-status="Aprovação">
      <h3>Aprovação</h3>
      <div class="lane" aria-label="Aprovação"></div>
    </section>

    <section class="col" data-status="Aguardando Aprovação">
      <h3>Aguardando Aprovação</h3>
      <div class="lane" aria-label="Aguardando Aprovação"></div>
    </section>

    <section class="col" data-status="Pronto pra Postar">
      <h3>Pronto pra Postar</h3>
      <div class="lane" aria-label="Pronto pra Postar"></div>
    </section>
  </main>

  <!-- Modal Novo Card -->
  <dialog id="modal">
    <form id="formNovo" method="dialog">
      <h3>Novo Card</h3>

      <label>Título
        <input type="text" id="m-titulo" required placeholder="Ex.: Reels - Promo fim de semana">
      </label>

      <div class="row">
        <label>Tipo
          <select id="m-tipo" required>
            <option>Reels</option>
            <option>Vídeo</option>
            <option>Carrossel</option>
            <option>Foto</option>
            <option>Stories</option>
          </select>
        </label>
        <label>Prioridade
          <select id="m-pri" required>
            <option>Alta</option>
            <option>Média</option>
            <option>Baixa</option>
          </select>
        </label>
      </div>

      <div class="row">
        <label>Responsável
          <input type="text" id="m-resp" required placeholder="Ex.: Mariana">
        </label>
        <label>Data
          <input type="date" id="m-data" required>
        </label>
      </div>

      <label>Coluna inicial
        <select id="m-col" required>
          <option>Redação</option>
          <option>Gravação</option>
          <option>Edição de vídeo</option>
          <option>Design</option>
          <option>Revisão</option>
          <option>Fotografia</option>
          <option>Aprovação</option>
          <option>Aguardando Aprovação</option>
          <option>Pronto pra Postar</option>
        </select>
      </label>

      <menu>
        <button type="reset" id="m-cancel" class="btn ghost">Cancelar</button>
        <button type="submit" class="btn grad">Adicionar</button>
      </menu>
    </form>
  </dialog>

  <script src="kanban.js"></script>
</body>
</html>
