<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento de Post - FlowUp</title>
  <link rel="stylesheet" href="agendamento.css">
</head>
<body>
<div class="app">
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sb-wrap">
      <div class="brand">
        <div class="dot"></div>
        <div class="name">FlowUp</div>
      </div>
      <nav class="menu">
        <a href="#" class="item">
          <div class="ico i-analytics"></div><span>Análise</span>
        </a>
        <a href="#" class="item active">
          <div class="ico i-calendar"></div><span>Calendário de Postagem</span>
        </a>
        <a href="#" class="item">
          <div class="ico i-manage"></div><span>Gestão</span>
        </a>
        <a href="#" class="item">
          <div class="ico i-briefing"></div><span>Briefing</span>
        </a>
        <a href="#" class="item">
          <div class="ico i-team"></div><span>Equipe</span>
        </a>
        <a href="#" class="item">
          <div class="ico i-settings"></div><span>Configuração</span>
        </a>
      </nav>
    </div>
  </aside>

  <!-- ===== CONTEÚDO ===== -->
  <div class="content">
    <!-- TOPO -->
    <header class="topbar">
      <div class="company">
        <select class="select">
          <option>Empresa A</option>
          <option>Empresa B</option>
        </select>
      </div>
      <div class="profile">
        <div class="avatar u"></div>
        <div class="info">
          <strong>Alonso</strong>
          <span>Produtor</span>
        </div>
      </div>
    </header>

    <!-- TOOLBAR -->
    <div class="toolbar card">
      <div class="filters">
        <label>
          Título do Post
          <input type="text" placeholder="Digite o título">
        </label>
        <label>
          Plataforma
          <select>
            <option>Instagram</option>
            <option>Facebook</option>
            <option>LinkedIn</option>
            <option>Twitter</option>
          </select>
        </label>
        <label>
          Data de Publicação
          <input type="date">
        </label>
        <label>
          Hora
          <input type="time">
        </label>
      </div>
      <button class="btn grad">Agendar Post</button>
    </div>

    <!-- LISTA DE POSTS -->
    <div class="list-area card">
      <div class="thead">
        <div>Título</div>
        <div class="c-resp">Responsáveis</div>
        <div class="c-date">Data</div>
        <div class="c-pri">Plataforma</div>
        <div class="c-act"></div>
      </div>

      <div class="groups">
        <div class="group-head">
          <div class="status-pill"><div class="dot"></div>Agendados</div>
          <span class="group-count">(3)</span>
          <button class="group-add">+ Novo</button>
        </div>

        <!-- LINHA 1 -->
        <div class="row">
          <div class="cell-name">
            <div class="checkbox"></div>
            <div class="title">Campanha Outubro Rosa</div>
          </div>
          <div class="avatars">
            <div class="av p1">MC</div>
            <div class="av p2">AL</div>
          </div>
          <div class="date">26/10/2025</div>
          <div class="pri">
            <div class="flag alta"></div>Instagram
          </div>
          <div class="act"><button class="kebab">⋮</button></div>
        </div>

        <!-- LINHA 2 -->
        <div class="row">
          <div class="cell-name">
            <div class="checkbox"></div>
            <div class="title">Black Friday Teaser</div>
          </div>
          <div class="avatars">
            <div class="av p3">RS</div>
            <div class="av p4">TM</div>
          </div>
          <div class="date">10/11/2025</div>
          <div class="pri">
            <div class="flag media"></div>Facebook
          </div>
          <div class="act"><button class="kebab">⋮</button></div>
        </div>

        <!-- LINHA 3 -->
        <div class="row">
          <div class="cell-name">
            <div class="checkbox"></div>
            <div class="title">Natal Solidário</div>
          </div>
          <div class="avatars">
            <div class="av p2">AL</div>
            <div class="av p1">MC</div>
          </div>
          <div class="date">15/12/2025</div>
          <div class="pri">
            <div class="flag baixa"></div>LinkedIn
          </div>
          <div class="act"><button class="kebab">⋮</button></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const agendarBtn = document.querySelector('.btn.grad');
  const listArea = document.querySelector('.groups');
  const avatarColors = ['p1','p2','p3','p4'];

  // Função que adiciona menu de ações a uma linha
  function attachActions(row) {
    const kebabBtn = row.querySelector('.kebab');
    if (!kebabBtn) return;

    kebabBtn.addEventListener('click', (e) => {
      // Fecha qualquer menu aberto
      document.querySelectorAll('.action-menu').forEach(m => m.remove());

      const menu = document.createElement('div');
      menu.classList.add('action-menu');
      menu.style.position = 'absolute';
      menu.style.background = '#fff';
      menu.style.border = '1px solid var(--line)';
      menu.style.borderRadius = '10px';
      menu.style.boxShadow = '0 4px 12px rgba(16,24,40,0.08)';
      menu.style.right = '0';
      menu.style.top = '100%';
      menu.style.zIndex = '10';
      menu.style.overflow = 'hidden';
      menu.innerHTML = `
        <button class="edit-btn" style="padding:10px 14px; width:100%; border:none; background:none; text-align:left; cursor:pointer;">Editar</button>
        <button class="delete-btn" style="padding:10px 14px; width:100%; border:none; background:none; text-align:left; cursor:pointer;">Excluir</button>
      `;

      kebabBtn.parentElement.appendChild(menu);

      // Excluir
      menu.querySelector('.delete-btn').addEventListener('click', () => row.remove());

      // Editar
      menu.querySelector('.edit-btn').addEventListener('click', () => {
        const titleElem = row.querySelector('.title');
        const priElem = row.querySelector('.pri');
        const dateElem = row.querySelector('.date');
        const avatarsElem = row.querySelector('.avatars');

        const newTitle = prompt('Novo título do post:', titleElem.textContent);
        if (newTitle) titleElem.textContent = newTitle;

        const newPlataforma = prompt('Nova plataforma:', priElem.textContent.replace(/Instagram|Facebook|LinkedIn|Twitter/g,'').trim());
        if (newPlataforma) priElem.innerHTML = `<div class="flag media"></div>${newPlataforma}`;

        const newDate = prompt('Nova data (dd/mm/aaaa hh:mm):', dateElem.textContent);
        if (newDate) dateElem.textContent = newDate;

        const newResp = prompt('Responsáveis (separados por vírgula):', Array.from(avatarsElem.querySelectorAll('.av')).map(a => a.textContent).join(', '));
        if (newResp) {
          const respArray = newResp.split(',').map(r => r.trim());
          avatarsElem.innerHTML = respArray.map((r,i) => `<div class="av ${avatarColors[i % avatarColors.length]}">${r}</div>`).join('');
        }

        menu.remove();
      });
    });

    // Fecha menu se clicar fora
    document.addEventListener('click', (event) => {
      if (!kebabBtn.contains(event.target)) {
        document.querySelectorAll('.action-menu').forEach(m => m.remove());
      }
    });
  }

  // Aplica para todas as linhas existentes
  document.querySelectorAll('.groups .row').forEach(row => attachActions(row));

  // Cria nova linha
  function createRow(title, plataforma, data, responsaveis = []) {
    const row = document.createElement('div');
    row.classList.add('row');

    const avatarsHTML = responsaveis.map((r,i) => `<div class="av ${avatarColors[i % avatarColors.length]}">${r}</div>`).join('');

    row.innerHTML = `
      <div class="cell-name">
        <div class="checkbox"></div>
        <div class="title">${title}</div>
      </div>
      <div class="avatars">${avatarsHTML}</div>
      <div class="date">${data}</div>
      <div class="pri">
        <div class="flag media"></div>${plataforma}
      </div>
      <div class="act">
        <button class="kebab">⋮</button>
      </div>
    `;

    attachActions(row);
    return row;
  }

  // Evento do botão Agendar Post
  agendarBtn.addEventListener('click', () => {
    const titulo = document.querySelector('.filters input[type="text"]').value.trim();
    const plataforma = document.querySelector('.filters select').value;
    const data = document.querySelector('.filters input[type="date"]').value;
    const hora = document.querySelector('.filters input[type="time"]').value;

    if (!titulo || !plataforma || !data || !hora) {
      alert('Preencha todos os campos!');
      return;
    }

    const responsaveisInput = prompt('Digite os responsáveis separados por vírgula:');
    const responsaveis = responsaveisInput ? responsaveisInput.split(',').map(r => r.trim()) : ['AL'];

    const fullData = `${data} ${hora}`;
    const newRow = createRow(titulo, plataforma, fullData, responsaveis);

    // Insere no topo da lista
    const firstRow = listArea.querySelector('.row');
    if (firstRow) listArea.insertBefore(newRow, firstRow);
    else listArea.appendChild(newRow);

    // Limpar campos
    document.querySelector('.filters input[type="text"]').value = '';
    document.querySelector('.filters input[type="date"]').value = '';
    document.querySelector('.filters input[type="time"]').value = '';
  });
});
</script>

</body>
</html>
